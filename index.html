<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DK 变化记录表 · 手机上传</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --fg:#1c2024; --muted:#6b7280;
    --line:#e5e7eb; --k:#dc2626; --d:#16a34a; --warn:#b45309; --warnbg:#fffbeb;
    --accent:#2563eb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#171a21; --fg:#e8eaed; --muted:#9aa3af;
      --line:#262b33; --k:#f87171; --d:#4ade80; --warn:#fbbf24; --warnbg:#2a2113;
      --accent:#60a5fa;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5;padding:16px;max-width:960px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  @media(max-width:640px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .card .n{font-size:22px;font-weight:700}
  .card .l{font-size:12px;color:var(--muted);margin-top:2px}
  .card.k .n{color:var(--k)} .card.d .n{color:var(--d)}
  .warnbox{background:var(--warnbg);border:1px solid var(--warn);border-radius:12px;
    padding:12px 14px;margin-bottom:18px}
  .warnbox h2{font-size:15px;margin:0 0 8px;color:var(--warn)}
  .witem{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 0;
    border-top:1px dashed var(--line);font-size:14px}
  .witem:first-of-type{border-top:none}
  .badge{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:700}
  .bK{background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k)}
  .bD{background:color-mix(in srgb,var(--d) 18%,transparent);color:var(--d)}
  .bSame{background:var(--warn);color:#fff}
  .arrow{color:var(--muted);font-weight:700}
  .upload{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
  .upload h2{font-size:15px;margin:0 0 10px}
  .filepick{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
  .filepick label{flex:1;min-width:140px;display:block;font-size:13px;color:var(--muted)}
  .filepick input{margin-top:6px;width:100%;font-size:13px}
  .btn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:13px;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .status{font-size:13px;color:var(--muted);min-height:18px;margin-top:8px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .controls input{flex:1;min-width:160px;padding:8px 10px;border-radius:9px;
    border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px}
  .controls button{padding:8px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:13px;cursor:pointer}
  .controls button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
  tr:last-child td{border-bottom:none}
  td.wrap{white-space:normal}
  .sK{color:var(--k);font-weight:700} .sD{color:var(--d);font-weight:700}
  .tl{color:var(--muted);font-size:12px}
  .empty{color:var(--muted);padding:20px;text-align:center}
  a{color:var(--accent)}
  .note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<h1>DK 变化记录表 · 手机上传</h1>
<div class="sub" id="sub">最后更新：— ｜ K→D / D→K 反转自动置顶预警</div>

<div class="upload">
  <h2>📤 上传当天两个表（手机直接选文件）</h2>
  <div class="filepick">
    <label>K表（含 K点 列，或 K 股清单）
      <input id="fk" type="file" accept=".xlsx,.xls,.csv" onchange="onPick()">
    </label>
    <label>D表（含 D点 列，或 D 股清单）
      <input id="fd" type="file" accept=".xlsx,.xls,.csv" onchange="onPick()">
    </label>
  </div>
  <div class="btnrow">
    <button class="btn primary" onclick="handleUpload()">解析并合并</button>
    <button class="btn" onclick="exportHistory()">导出历史(JSON)</button>
    <label class="btn">导入历史<input id="imp" type="file" accept=".json" style="display:none" onchange="importHistory(event)"></label>
    <button class="btn" onclick="clearLocal()">清空本地</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="cards" id="cards"></div>
<div class="warnbox" id="warnbox">
  <h2>⚠ 反转预警（重点提示）</h2>
  <div id="warns"></div>
</div>

<div class="controls">
  <input id="q" placeholder="搜索代码 / 名称…" oninput="render()">
  <button id="f_all" class="on" onclick="setF('all',this)">全部</button>
  <button id="f_rev" onclick="setF('rev',this)">仅反转</button>
  <button id="f_k" onclick="setF('k',this)">当前K</button>
  <button id="f_d" onclick="setF('d',this)">当前D</button>
</div>

<table>
  <thead><tr>
    <th>代码</th><th>名称</th><th>当前</th><th>涨幅%</th><th>首现</th><th>末次</th>
    <th>K</th><th>D</th><th>反转</th><th>连续</th><th>状态时间线</th>
  </tr></thead>
  <tbody id="tbody"></tbody>
</table>

<div class="note">
  说明：本页在<b>浏览器本地</b>保存全部历史（localStorage）。手机上传后数据留在这台手机的这个浏览器里；
  换设备/清缓存会丢，请用「导出历史」备份、或「导入历史」迁移。<br>
  解析自动识别两种格式：① 选股导出（K点/D点 列值为「符合」的才是信号）；② 精简清单（整表每行都是信号，按文件名含 K/D 区分）。
</div>

function loadHistory(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  const h = {updated:SEED.updated, days:(SEED.days||[]).map(d=>({...d})),
             names:SEED.names||{}};
  saveHistory(h); return h;
}
function saveHistory(h){ localStorage.setItem(LS_KEY, JSON.stringify(h)); }
function setStatus(s){ document.getElementById('status').textContent = s||''; }

function findCol(headers, cands){
  const low = {}; headers.forEach((h,i)=>{ if(h) low[String(h).toLowerCase()]=i; });
  for(const c of cands){ if(h in low) return low[h]; if(c.toLowerCase() in low) return low[c.toLowerCase()]; }
  for(const c of cands){ const cl=c.toLowerCase(); if(!cl) continue;
    for(const h in low){ if(low.hasOwnProperty(h) && String(h).includes(cl)) return low[h]; } }
  return null;
}
function normCode(v){
  let s = String(v==null?'':v).replace(/\.0$/,'');
  s = s.replace(/[^\d]/g,'');
  if(/^\d+$/.test(s)) s = s.padStart(6,'0');
  return s;
}
function detectDate(...names){
  for(const n of names){
    let m = (n||'').match(/(\d{4}-\d{2}-\d{2})/); if(m) return m[1];
    m = (n||'').match(/(\d{4})[.\-年\/](\d{2})[.\-月\/](\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  }
  const t = new Date();
  const p = x=>String(x).padStart(2,'0');
  return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate());
}
function todayStr(){ return detectDate(''); }

async function parseFile(file, kindHint){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:false});
  let hr=0;
  for(let i=0;i<rows.length;i++){ if(rows[i] && rows[i].some(c=>c!=null && String(c).includes('代码'))){ hr=i; break; } }
  const headers = (rows[hr]||[]).map(c=>c==null?'':String(c).trim());
  const code_i = findCol(headers,['代码','股票代码','证券代码','code']);
  const name_i = findCol(headers,['名称','股票名称','证券名称','name']);
  const metric_i = findCol(headers,['涨跌幅','涨幅','pct','涨跌幅%','涨跌幅(%)']);
  const kpt = findCol(headers,['K点']); const dpt = findCol(headers,['D点']);
  let marker_i=null, kind=kindHint;
  if(kpt!=null){ marker_i=kpt; kind='K'; }
  else if(dpt!=null){ marker_i=dpt; kind='D'; }
  const codes=new Set(); const metrics={}; const names={};
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i]; if(!r || r.every(c=>c==null)) continue;
    if(marker_i!=null){ const v=r[marker_i]; if(v==null || String(v).trim()!=='符合') continue; }
    const raw=r[code_i]; if(raw==null) continue;
    const code=normCode(raw); if(!code) continue;
    const nm = (name_i!=null && r[name_i]!=null) ? String(r[name_i]).trim() : '';
    if(nm) names[code]=nm;
    if(metric_i!=null && r[metric_i]!=null){ const m=parseFloat(String(r[metric_i]).replace('%','')); if(!isNaN(m)) metrics[code]=m; }
    codes.add(code);
  }
  return {kind, codes:[...codes], metrics, names, mode: marker_i!=null?'选股(符合)':'清单'};
}

async function handleUpload(){
  const fk=document.getElementById('fk').files[0];
  const fd=document.getElementById('fd').files[0];
  if(!fk||!fd){ alert('请同时选择 K表 和 D表 两个文件'); return; }
  if(typeof XLSX==='undefined'){ alert('表格解析库未加载，请检查网络后刷新页面'); return; }
  setStatus('解析中…');
  try{
    const kData=await parseFile(fk,'K');
    const dData=await parseFile(fd,'D');
    const date=detectDate(fk.name, fd.name) || todayStr();
    let kArr=[], dArr=[];
    [kData,dData].forEach(d=>{ if(d.kind==='K') kArr=kArr.concat(d.codes); else if(d.kind==='D') dArr=dArr.concat(d.codes); });
    if(kArr.length===0 && dArr.length===0){ kArr=kData.codes; dArr=dData.codes; }
    const h=loadHistory();
    const days=(h.days||[]).filter(d=>d.date!==date);
    const metrics={...((kData||{}).metrics||{}), ...((dData||{}).metrics||{})};
    const names={...((kData||{}).names||{}), ...((dData||{}).names||{})};
    days.push({date, k:kArr, d:dArr, metrics});
    days.sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
    h.days=days; h.updated=date; h.names={...h.names,...names};
    saveHistory(h);
    setStatus('已合并 '+date+'：K='+kArr.length+'  D='+dArr.length+'（历史共 '+days.length+' 天）');
    render();
  }catch(e){ setStatus('解析失败：'+e.message); }
}

function analyze(h){
  const days=h.days||[];
  const names=h.names||{};
  const set=new Set(Object.keys(names));
  days.forEach(d=>{ (d.k||[]).forEach(c=>set.add(c)); (d.d||[]).forEach(c=>set.add(c)); });
  const latestMetrics = days.length ? (days[days.length-1].metrics||{}) : {};
  const timelines={};
  set.forEach(code=>{
    const tl=[];
    days.forEach(d=>{
      if((d.k||[]).includes(code)) tl.push({date:d.date,state:'K'});
      if((d.d||[]).includes(code)) tl.push({date:d.date,state:'D'});
    });
    timelines[code]=tl;
  });
  const rows=[]; let totalRev=0;
  set.forEach(code=>{
    const tl=timelines[code];
    const nK=tl.filter(e=>e.state==='K').length;
    const nD=tl.filter(e=>e.state==='D').length;
    const reversals=[];
    for(let i=0;i<tl.length-1;i++){
      const a=tl[i], b=tl[i+1];
      if(a.state!==b.state && a.date!==b.date) reversals.push({from:a.state,to:b.state,from_date:a.date,to_date:b.date,same_day:false});
    }
    totalRev+=reversals.length;
    const last=tl[tl.length-1]||null, first=tl[0]||null;
    let cons=1; for(let i=tl.length-1;i>0;i--){ if(tl[i].state===tl[i-1].state) cons++; else break; }
    rows.push({code,name:names[code]||'',metric:latestMetrics[code],nK,nD,
      first_date:first?first.date:null,last_date:last?last.date:null,
      current:last?last.state:null,reversals,n_reversals:reversals.length,
      latest_reversal:reversals.length?reversals[reversals.length-1]:null,trailing:cons,timeline:tl});
  });
  rows.sort((x,y)=>{
    const ax=x.latest_reversal,bx=y.latest_reversal;
    const ad=ax?ax.to_date:'0000-00-00', bd=bx?bx.to_date:'0000-00-00';
    return (bx?1:0)-(ax?1:0) || (bd<ad?1:bd>ad?-1:0) || ((y.last_date||'')<(x.last_date||'')?1:-1);
  });
  const todayDay = days.length ? days[days.length-1] : {k:[],d:[]};
  return {updated:h.updated, today:days.length?days[days.length-1].date:null,
    today_k:todayDay.k||[], today_d:todayDay.d||[],
    total_stocks:rows.length, total_reversals:totalRev,
    stocks_with_reversal:rows.filter(r=>r.reversals.length).length, rows};
}

function fmtMetric(m){ if(m==null) return '-'; const cls=m>0?'sK':(m<0?'sD':''); const sign=m>0?'+':''; return '<span class="'+cls+'">'+sign+(+m).toFixed(2)+'</span>'; }
function stateBadge(s){ if(s==='K') return '<span class="badge bK">K</span>'; if(s==='D') return '<span class="badge bD">D</span>'; return ''; }
function tlText(tl){ return tl.map(e=>{ const m=e.date.slice(5); return (e.state==='K'?'<span class=sK>K</span>':'<span class=sD>D</span>')+'<span class=tl>'+m+'</span>'; }).join(' → '); }

    return '<tr><td>'+esc(r.code)+'</td><td>'+esc(r.name)+'</td><td>'+cur+'</td><td>'+fmtMetric(r.metric)+'</td>'+
      '<td class="tl">'+esc(r.first_date)+'</td><td class="tl">'+esc(r.last_date)+'</td>'+
      '<td>'+r.nK+'</td><td>'+r.nD+'</td><td>'+rev+'</td><td>'+r.trailing+'</td>'+
      '<td class="wrap tl">'+tlText(r.timeline)+'</td></tr>';
  }).join('');
}
function card(n,l,cls){ return '<div class="card '+(cls||'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

function exportHistory(){ const h=loadHistory(); const blob=new Blob([JSON.stringify(h,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dk_history_'+(h.updated||'')+'.json'; a.click(); }
function importHistory(e){ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const h=JSON.parse(rd.result); if(!h.days) throw new Error('格式不对'); saveHistory(h); setStatus('已导入历史，共 '+h.days.length+' 天'); render(); }
    catch(err){ alert('导入失败：'+err.message); } }; rd.readAsText(f); }
function clearLocal(){ if(confirm('确定清空本机历史？会回到初始种子数据（可用导出备份）。')){ localStorage.removeItem(LS_KEY); render(); setStatus('已清空，恢复初始数据'); } }

render();
</script>
</body>
</html>
