<title>DK 背离追踪器</title>
<style>
:root{
  --bg:#0f1419; --card:#1a2230; --card2:#222c3c; --line:#2c384a;
  --txt:#e6edf3; --dim:#8b97a7; --acc:#4da3ff;
  --red:#ff5b5b; --green:#23c552; --gold:#ffcf5c;
}
.light{
  --bg:#f4f6fa; --card:#ffffff; --card2:#eef2f7; --line:#dde3ec;
  --txt:#1a2230; --dim:#6b7787; --acc:#1a73e8;
  --red:#e0322f; --green:#0a9d3f; --gold:#c98a00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:10px 10px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-size:18px;margin:0;font-weight:700}
.meta{font-size:11px;color:var(--dim);margin-top:2px}
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:background .15s}
.stat.on{background:var(--card2);border-color:var(--acc)}
.stat b{display:block;font-size:20px;font-weight:700}
.stat span{font-size:11px;color:var(--dim)}
.signal{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--dim);margin:0 0 8px;line-height:1.5}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:4px}
.tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--dim);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:14px}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--txt);font-size:13px}
.note{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--dim);margin:6px 0;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0}
.card.d{border-left-color:var(--red)}
.card.k{border-left-color:var(--green)}
.card.b{border-left-color:var(--gold)}
.row1{display:flex;justify-content:space-between;align-items:baseline}
.code{font-weight:700;font-size:16px}
.name{color:var(--dim);font-size:13px;margin-left:6px}
.price{font-size:15px;font-weight:600}
.chg{font-size:13px;margin-left:6px}
.up{color:var(--red)} .down{color:var(--green)} .flat{color:var(--dim)}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:12px;color:var(--dim)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px}
.tag.d{color:var(--red);border-color:var(--red)}
.tag.k{color:var(--green);border-color:var(--green)}
.tag.lean-d{color:var(--red)} .tag.lean-k{color:var(--green)}
/* 末信号徽章：末D=红(多头区/吸筹), 末K=绿(空头区/派发), F=灰(横盘) */
.last{display:inline-flex;align-items:center;gap:3px;font-weight:700;padding:2px 8px;border-radius:6px;font-size:12px;border:1px solid}
.last.lD{color:var(--red);border-color:var(--red);background:rgba(255,91,91,.08)}
.last.lK{color:var(--green);border-color:var(--green);background:rgba(35,197,82,.08)}
.last.lF{color:var(--dim);border-color:var(--line)}
.chips{display:flex;gap:6px;margin:2px 0 8px;overflow-x:auto}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:12px;color:var(--dim);cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row2b{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--dim)}
.empty{text-align:center;color:var(--dim);padding:40px 10px;font-size:14px}
#cnt{font-size:12px;color:var(--dim);margin:6px 2px}
</style>
</head>

268":{"l":"D","s":"i","g":"a","c":"high"},"688428":{"l":"D","s":"e","g":"s"},"603043":{"l":"D","s":"i","g":"a","c":"high"},"603202":{"l":"F","s":"i","g":"a","c":"low"},"002439":{"l":"F","s":"i","g":"s","c":"low"},"002922":{"l":"D","s":"e","g":"s"},"000725":{"l":"K","s":"e","g":"s"},"000031":{"l":"D","s":"i","g":"a","c":"high"},"603075":{"l":"K","s":"i","g":"a","c":"mid"},"002166":{"l":"D","s":"e","g":"s"},"000932":{"l":"K","s":"e","g":"s"},"600661":{"l":"F","s":"i","g":"a","c":"low"},"002730":{"l":"F","s":"i","g":"a","c":"low"},"603707":{"l":"F","s":"i","g":"s","c":"low"},"603659":{"l":"K","s":"i","g":"a","c":"high"},"300159":{"l":"F","s":"i","g":"a","c":"low"},"002097":{"l":"D","s":"e","g":"s"},"920454":{"l":"D","s":"e","g":"s"},"688819":{"l":"K","s":"i","g":"a","c":"high"},"603778":{"l":"D","s":"i","g":"a","c":"high"},"000571":{"l":"K","s":"e","g":"s"},"002558":{"l":"D","s":"i","g":"s","c":"high"},"300369":{"l":"D","s":"i","g":"a","c":"high"},"300792":{"l":"D","s":"e","g":"s"},"000681":{"l":"D","s":"e","g":"s"},"300308":{"l":"K","s":"i","g":"a","c":"high"},"002917":{"l":"D","s":"i","g":"a","c":"high"}};
const PARTS=10;
let DATA=null;   // {code:{l:'D'|'K'|'F', s:'e'(东财9月确认)|'i'(走势推断), g:'s'(9月有信号)|'a'(只在8月), c:conf}}
const $=s=>document.querySelector(s);

function load(){
  try{
    // v5: 数据已内嵌到 SEED_DATA/SEED_LAST，无需 fetch
    const stocks=SEED_DATA.map(row=>({
      code:row[0],name:row[1],price:row[2],chg:row[3],cap:row[4],ind:row[5],
      inD:!!row[6],inK:!!row[7],dCount:row[8]||0,kCount:row[9]||0,
      net:(row[8]||0)-(row[9]||0),
      recentD:!!row[10],recentK:!!row[11],   // 9/1-9/4 子窗口(9月新信号层)
      last:SEED_LAST[row[0]]||null
    }));
    DATA={meta:META,stocks,
      stats:{total:stocks.length,
        d_only:stocks.filter(x=>x.inD&&!x.inK).length,
        k_only:stocks.filter(x=>x.inK&&!x.inD).length,
        both:stocks.filter(x=>x.inD&&x.inK).length}};
  }catch(e){
    DATA=null;
    $('#meta').textContent='v5 数据异常: '+(e.message||e)+'（联系 WorkBuddy）';
    console.error('[dk-tracker v5]',e);
    return;
  }
  const m=DATA.meta,s=DATA.stats;
  $('#meta').textContent=`数据日 ${m.generated} · 窗口 ${m.window} · 来源 ${m.source}`;
  $('#note').textContent=`说明：${m.note}。「双现」=窗口内既出D又出K，最该盯；筛「末D」=最新停在买入红区，「末K」=最新停在卖出蓝区。徽章带「东财9月✓」=9/1后东财信号直接确认，最可信。`;
  $('#stats').innerHTML=`
    <div class="stat ${tab==='all'?'on':''}" data-t="all"><b>${s.total}</b><span>总计</span></div>
    <div class="stat ${tab==='d'?'on':''}" data-t="d"><b style="color:var(--red)">${s.d_only}</b><span>D 独有</span></div>
    <div class="stat ${tab==='k'?'on':''}" data-t="k"><b style="color:var(--green)">${s.k_only}</b><span>K 独有</span></div>
    <div class="stat ${tab==='both'?'on':''}" data-t="both"><b style="color:var(--gold)">${s.both}</b><span>双现</span></div>`;
  $('#signal').textContent=blueSignal();
  render();
}

let tab='all';
let lastF='all';   // 末信号筛选: all|D|K|F
function setTab(t){
  tab=t;
  lastF='all';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  document.querySelectorAll('.stat').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  const chips=$('#chips');
  chips.style.display=(tab==='both')?'flex':'none';
  document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on',x.dataset.l==='all'));
  render();
}
$('#chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  lastF=c.dataset.l;
  document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on',x===c));
  render();
});
$('#tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  setTab(t.dataset.t);
});
$('#stats').addEventListener('click',e=>{
  const s=e.target.closest('.stat');if(!s)return;
  setTab(s.dataset.t);
});

function blueSignal(){
  if(!DATA) return '—';
  const top=[...DATA.stocks].sort((a,b)=>(b.cap||0)-(a.cap||0)).slice(0,100);
  const d=top.filter(s=>s.inD&&!s.inK).length;   // D独有:只出过买入信号(吸筹区)
  const k=top.filter(s=>s.inK&&!s.inD).length;   // K独有:只出过卖出信号(派发区)
  const b=top.filter(s=>s.inD&&s.inK).length;
  const n=top.length;
  let sig='多空交织';
  if(d>k) sig='蓝筹吸筹(买)>派发(卖)，风格偏积极';
  else if(k>d) sig='蓝筹派发(卖)>吸筹(买)，风格偏谨慎';
  // 双现票末信号分布（推断）
  let bD=0,bK=0,bF=0,eD=0,eK=0;
  top.filter(s=>s.inD&&s.inK).forEach(s=>{
    const li=lastInfo(s);
    if(!li||!li.last) bF++;
    else if(li.last==='D'){bD++; if(li.src==='e')eD++;}
    else if(li.last==='K'){bK++; if(li.src==='e')eK++;}
    else bF++;
  });
  const bPart = b?` 双现末信号: 末D ${bD}(东财${eD}) / 末K ${bK}(东财${eK}) / 横盘 ${bF}`:'';
  return `蓝筹Top100：D区=${d}(${((d/n)*100).toFixed(1)}%) K区=${k}(${((k/n)*100).toFixed(1)}%) 双现=${b}(${((b/n)*100).toFixed(1)}%) — ${sig}。${bPart}`;
}
$('#search').addEventListener('input',render);
$('#sort').addEventListener('change',render);

function isRecent(s){return !!(s.recentD||s.recentK||(s.recent&&(s.recent.d||s.recent.k)));}
function flt(s){
  if(tab==='d') return s.inD && !s.inK;
  if(tab==='k') return s.inK && !s.inD;
  if(tab==='both'){
    if(!(s.inD&&s.inK)) return false;
    if(lastF==='all') return true;
    if(lastF==='S') return isRecent(s);   // 9/1-9/4 有新信号
    if(lastF==='U') return !(s.last&&s.last.l);
    return (s.last&&s.last.l)===lastF;
  }
  return true;
}
function zone(s){return (s.inD&&s.inK)?'b':(s.inD?'d':'k');}
function lastInfo(s){
  // 双现票 s.last={l:'D/K/F', s:'e'=东财9月确认|'i'=走势推断, g:'s'=9月信号|'a'=8月, c:conf}
  if(s.last && s.last.l){
    const L=s.last;
    let sub = L.s==='e' ? '东财9月✓' : (L.g==='s' ? '9月反复·推断' : '8月信号·推断');
    if(L.l==='F') sub='近10日无方向';
    return {last:L.l, src:L.s||'i', seg:L.g||'a', conf:L.s==='e'?'sure':(L.c||'low'), sub};
  }
  if(s.inD && !s.inK) return {last:'D', conf:'sure', src:'x', sub:'区间唯一'};
  if(s.inK && !s.inD) return {last:'K', conf:'sure', src:'x', sub:'区间唯一'};
  return null;
}

function render(){
  if(!DATA)return;
  const q=$('#search').value.trim().toLowerCase();
  const sort=$('#sort').value;
  let arr=DATA.stocks.filter(flt);
  if(q) arr=arr.filter(s=>(s.code+' '+s.name+' '+s.ind).toLowerCase().includes(q));
  arr.sort((a,b)=>{
    if(sort==='last'){
      const rk=x=>{const l=lastInfo(x);if(!l||!l.last)return 3;return l.last==='D'?0:(l.last==='K'?1:2);};
      const rkA=rk(a),rkB=rk(b);
      if(rkA!==rkB) return rkA-rkB;
      return (b.cap||0)-(a.cap||0);
    }
    if(sort==='cnt') return (b.dCount+b.kCount)-(a.dCount+a.kCount);
    if(sort==='cap')  return (b.cap||0)-(a.cap||0);
    if(sort==='chg')  return (b.chg??-999)-(a.chg??-999);
    if(sort==='code') return a.code.localeCompare(b.code);
    return 0;
  });
  $('#cnt').textContent=`共 ${arr.length} 只`;
  const list=$('#list');
  if(!arr.length){list.innerHTML='<div class="empty">无匹配</div>';return;}
  list.innerHTML=arr.map(card).join('');
}

function card(s){
  const z=zone(s);
  const chg=s.chg, cls=chg==null?'flat':(chg>0?'up':(chg<0?'down':'flat'));
  const chgTxt=chg==null?'—':(chg>0?'+':'')+chg.toFixed(2)+'%';
  const price=s.price==null?'—':s.price.toFixed(2);
  const cap=s.cap==null?'—':s.cap.toFixed(1)+'亿';
  let badges='';
  if(s.inD) badges+=`<span class="tag d">D×${s.dCount}</span>`;
  if(s.inK) badges+=`<span class="tag k">K×${s.kCount}</span>`;
  // 末信号徽章
  const li=lastInfo(s);
  let lastHtml='';
  if(z==='b'){
    if(!li) lastHtml='<span class="last lF">末信号 ?</span>';
    else if(li.last==='D') lastHtml=`<span class="last lD">末D · ${li.sub}</span>`;
    else if(li.last==='K') lastHtml=`<span class="last lK">末K · ${li.sub}</span>`;
    else lastHtml='<span class="last lF">横盘待定</span>';
  }else if(z==='d'){
    lastHtml='<span class="last lD">D 区 · 吸筹</span>';
  }else{
    lastHtml='<span class="last lK">K 区 · 派发</span>';
  }
  return `<div class="card ${z}">
    <div class="row1">
      <div><span class="code">${s.code}</span><span class="name">${s.name}</span></div>
      <div><span class="price">${price}</span><span class="chg ${cls}">${chgTxt}</span></div>
    </div>
    <div class="row2b">
      <span>${lastHtml}</span>
      <span class="tags">${badges}</span>
    </div>
    <div class="row2">
      <span>市值 ${cap} · ${s.ind||'—'}</span>
      <span style="font-size:10px">${z==='b' ? (li&&li.src==='e'?'东财9月信号确认':'走势推断(近10日)') : '东财口径(区间唯一)'}</span>
    </div>
  </div>`;
}

load();
</script>
